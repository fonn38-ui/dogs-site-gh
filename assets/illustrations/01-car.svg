<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2238"/>
      <stop offset="100%" stop-color="#0F1424"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g)"/>
  
<!-- Дорога / линия горизонта -->
<line x1="0" y1="280" x2="600" y2="280" stroke="#2A3656" stroke-width="2" stroke-dasharray="20 15" opacity="0.5"/>
<!-- Машина (вид сверху) -->
<rect x="180" y="120" width="240" height="140" rx="22" fill="#FFB347"/>
<rect x="195" y="135" width="210" height="100" rx="14" fill="#FFD580" opacity="0.6"/>
<!-- Ветровое стекло -->
<path d="M 200 138 L 240 138 L 240 220 L 200 220 Z" fill="#7DD3FC" opacity="0.5"/>
<path d="M 360 138 L 400 138 L 400 220 L 360 220 Z" fill="#7DD3FC" opacity="0.5"/>
<!-- Собака в окне (только голова) -->
<ellipse cx="300" cy="160" rx="32" ry="28" fill="#F4A261"/>
<circle cx="290" cy="156" r="3" fill="#1A2238"/>
<circle cx="310" cy="156" r="3" fill="#1A2238"/>
<ellipse cx="300" cy="168" rx="4" ry="3" fill="#1A2238"/>
<path d="M 280 175 Q 300 185 320 175" stroke="#1A2238" stroke-width="2" fill="none" stroke-linecap="round"/>
<!-- Уши -->
<path d="M 270 138 L 274 158 L 280 142 Z" fill="#E76F51"/>
<path d="M 330 138 L 326 158 L 320 142 Z" fill="#E76F51"/>
<!-- GPS / точка -->
<circle cx="300" cy="100" r="8" fill="#FF5C5C"/>
<circle cx="300" cy="100" r="14" fill="none" stroke="#FF5C5C" stroke-width="2" opacity="0.5"/>
<circle cx="300" cy="100" r="20" fill="none" stroke="#FF5C5C" stroke-width="1.5" opacity="0.3"/>
<!-- 30 км надпись -->
<text x="50" y="60" font-family="Arial" font-size="14" fill="#FFB347" font-weight="600">📍 30 км</text>

</svg>